<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arena · testes de página</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --fundo:#151A21; --painel:#1B222B; --painel-2:#222A35; --linha:#2F3945;
  --texto:#ECE6D8; --suave:#9AA3B2; --apagado:#6B7483;
  --latao:#C9A24B; --latao-claro:#E4C77F;
  --erro:#E46F6F; --ok:#7CC6A4;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --raio:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--latao-claro);outline-offset:2px}
.escondido{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.lateral{border-right:1px solid var(--linha);padding:28px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-.01em;line-height:1;margin:0 6px}
.marca small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--suave);letter-spacing:0;margin-top:6px;font-weight:400}
.lista-testes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lista-testes button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:8px 1fr;gap:10px;align-items:center}
.lista-testes button:hover{background:var(--painel)}
.lista-testes button[aria-current="true"]{background:var(--painel-2)}
.lista-testes .nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista-testes .sub{grid-column:2;font-size:12.5px;color:var(--suave);margin-top:-6px}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--apagado)}
.ponto.ativo{background:var(--ok)} .ponto.pausado{background:var(--latao)}
.lateral .rodape{margin-top:auto;font-size:13px;color:var(--suave)}
.lateral .rodape button{background:none;border:0;padding:0;color:var(--suave);text-decoration:underline;cursor:pointer}

main{padding:34px clamp(18px,4vw,52px) 80px;min-width:0}
.topo{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:26px}
.topo h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,3vw,34px);line-height:1.1;margin:0;letter-spacing:-.01em}
.topo .meta{color:var(--suave);font-size:13.5px;margin-top:6px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:30px}
.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--suave);cursor:pointer;margin-bottom:-1px}
.abas button[aria-selected="true"]{color:var(--texto);border-color:var(--latao)}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--painel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#44505f}
.btn.principal{background:var(--latao);border-color:var(--latao);color:#1E1A10}
.btn.principal:hover{background:var(--latao-claro)}
.btn.discreto{background:none}
.btn[disabled]{opacity:.5;cursor:default}
.segmentos{display:inline-flex;border:1px solid var(--linha);border-radius:8px;padding:3px;gap:2px;background:var(--painel)}
.segmentos button{background:none;border:0;border-radius:6px;padding:6px 11px;color:var(--suave);cursor:pointer;font-size:13.5px}
.segmentos button[aria-pressed="true"]{background:var(--painel-2);color:var(--texto)}
.controles{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.campo,input.campo{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:9px 12px;min-width:0}
input.campo:focus,select.campo:focus{border-color:var(--latao)}
label.rotulo{display:block;font-size:13px;color:var(--suave);margin-bottom:6px}

/* ---------- placar (destaque) ---------- */
.placar{padding:6px 0 34px;border-bottom:1px solid var(--linha);margin-bottom:34px}
.veredito{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.4vw,42px);line-height:1.15;letter-spacing:-.015em;margin:0 0 10px;max-width:24ch}
.veredito-sub{color:var(--suave);margin:0 0 26px;max-width:62ch}
.corrida{display:flex;height:54px;border-radius:12px;overflow:hidden;background:var(--painel);gap:3px}
.faixa{--c:#888;flex:0 1 0%;background:var(--c);display:flex;align-items:center;padding-left:14px;color:#10141A;font-family:var(--serif);font-size:22px;font-weight:600;min-width:0;overflow:hidden;transition:flex-basis 1.1s cubic-bezier(.2,.8,.2,1);opacity:.55}
.faixa.lider{opacity:1;box-shadow:inset 0 0 0 3px var(--latao-claro)}
.legenda{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:14px;font-size:14px}
.legenda span{display:inline-flex;align-items:center;gap:8px;color:var(--suave)}
.legenda b{color:var(--texto);font-weight:600}
.chip{--c:#888;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--c);color:#10141A;font-weight:600;font-size:12.5px;flex:none}
.progresso{margin:18px 0 0;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--suave)}
.progresso b{color:var(--texto);font-weight:500}
.placar .acoes{margin-top:22px}

/* ---------- variantes lado a lado ---------- */
.competidores{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));border:1px solid var(--linha);border-radius:14px;overflow:hidden;margin-bottom:40px}
.competidor{--c:#888;padding:22px 22px 20px;border-right:1px solid var(--linha);border-top:4px solid var(--c);background:var(--painel);min-width:0}
.competidor:last-child{border-right:0}
.competidor.lider{background:linear-gradient(180deg,rgba(201,162,75,.09),transparent 140px),var(--painel)}
.competidor header{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.competidor .letra{font-family:var(--serif);font-size:34px;line-height:.9;color:var(--c);font-weight:600}
.competidor h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.competidor header a{font-size:12.5px;color:var(--suave);text-decoration:none;overflow-wrap:anywhere}
.competidor header a:hover{text-decoration:underline}
.coroa{margin-left:auto;font-size:12.5px;color:var(--latao-claro);border:1px solid rgba(201,162,75,.5);border-radius:99px;padding:2px 9px;white-space:nowrap}
.taxa strong{display:block;font-family:var(--serif);font-weight:500;font-size:44px;line-height:1;letter-spacing:-.02em}
.taxa span{font-size:13px;color:var(--suave)}
.lift{margin:8px 0 18px;font-size:14px;color:var(--suave)}
.lift .sobe{color:var(--ok)} .lift .desce{color:var(--erro)}
.funil{margin:0 0 18px;display:flex;flex-direction:column;gap:9px}
.funil div{position:relative;display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding-bottom:6px}
.funil dt{color:var(--suave)} .funil dd{margin:0;font-weight:500;white-space:nowrap}
.funil dd small{color:var(--apagado);font-weight:400;margin-left:4px}
.funil i{position:absolute;left:0;bottom:0;height:3px;border-radius:3px;background:var(--c);opacity:.75;max-width:100%}
.funil div::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--painel-2);z-index:-1}
.funil{isolation:isolate}
.extras{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--linha);display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px}
.extras span{display:block;color:var(--suave);font-size:12px}
.extras b{font-weight:500}

/* ---------- blocos ---------- */
.bloco{margin-bottom:44px}
.bloco-topo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.bloco h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;letter-spacing:-.01em}
.bloco .nota{color:var(--suave);font-size:13.5px;margin:6px 0 0;max-width:70ch}
.totais{display:flex;flex-wrap:wrap;gap:10px 34px;margin:-10px 0 40px;color:var(--suave);font-size:14px}
.totais b{color:var(--texto);font-weight:600;font-size:16px;margin-right:4px}
.grafico{position:relative;height:300px;border:1px solid var(--linha);border-radius:14px;padding:16px;background:var(--painel)}
.tabela-rolagem{overflow-x:auto;border:1px solid var(--linha);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--linha);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;max-width:280px;overflow-wrap:anywhere}
th{font-weight:500;color:var(--suave);background:var(--painel)}
tr:last-child td{border-bottom:0}
td small{color:var(--apagado);margin-left:4px}
.vazio-tabela{padding:22px;color:var(--suave);text-align:center}

/* ---------- editor ---------- */
.form{max-width:860px}
.linha-form{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;margin-bottom:30px}
.linha-form .campo{width:100%}
.editor-variantes{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.var-linha{--c:#888;display:grid;grid-template-columns:34px 1fr 2fr 110px 36px;gap:10px;align-items:center;padding:12px;border:1px solid var(--linha);border-radius:var(--raio);background:var(--painel)}
.var-linha .chip{width:30px;height:30px;font-size:15px}
.var-linha .campo{width:100%}
.peso{position:relative}
.peso input{padding-right:52px}
.peso output{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--suave);pointer-events:none}
.remover{background:none;border:0;color:var(--suave);cursor:pointer;font-size:20px;border-radius:6px;height:36px}
.remover:hover{color:var(--erro)}
.remover[disabled]{visibility:hidden}
.acoes-form{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}
.aviso{border:1px solid rgba(201,162,75,.45);background:rgba(201,162,75,.07);border-radius:var(--raio);padding:12px 16px;font-size:14px;margin:18px 0 0;max-width:860px}

/* ---------- instalação ---------- */
.passos{list-style:none;counter-reset:passo;margin:0;padding:0;max-width:880px}
.passos>li{counter-increment:passo;position:relative;padding:0 0 38px 54px}
.passos>li::before{content:counter(passo);position:absolute;left:0;top:-4px;font-family:var(--serif);font-size:30px;color:var(--latao);line-height:1}
.passos h3{margin:0 0 6px;font-size:17px;font-weight:600}
.passos p,.passos li li{color:var(--suave);font-size:14px}
.passos ul{padding-left:18px;margin:8px 0}
.codigo{position:relative;margin-top:12px}
.codigo pre{margin:0;max-height:260px;overflow:auto;background:#10151B;border:1px solid var(--linha);border-radius:var(--raio);padding:16px;font-size:12.5px;line-height:1.55;color:#C9D1DC;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codigo .btn{position:absolute;top:10px;right:10px;padding:6px 11px;font-size:13px}

/* ---------- conexão / vazio ---------- */
.centro{min-height:100vh;display:grid;place-items:center;padding:24px}
.cartao-conexao{width:min(460px,100%)}
.cartao-conexao h1{font-family:var(--serif);font-weight:500;font-size:44px;margin:0 0 8px;line-height:1}
.cartao-conexao p{color:var(--suave);margin:0 0 28px}
.cartao-conexao .campo{width:100%;margin-bottom:18px}
.erro-txt{color:var(--erro);font-size:14px;margin:-6px 0 16px}
.vazio{padding:60px 0;max-width:520px}
.vazio h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 10px}
.vazio p{color:var(--suave);margin:0 0 22px}
.carregando{color:var(--suave);padding:40px 0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--painel-2);border:1px solid var(--linha);border-radius:10px;padding:12px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:10;max-width:calc(100% - 32px)}
.toast.erro{border-color:var(--erro)}

/* ---------- celular ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .lateral{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linha);padding:18px 16px;gap:14px}
  .lista-testes{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .lista-testes li{flex:0 0 auto;max-width:220px}
  .lista-testes .sub{display:none}
  .lateral .rodape{display:none}
  .competidor{border-right:0;border-bottom:1px solid var(--linha)}
  .linha-form{grid-template-columns:1fr}
  .var-linha{grid-template-columns:30px 1fr 36px}
  .var-linha .url,.var-linha .peso{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){ .faixa{transition:none} }
</style>

<body>
<div id="raiz"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
/* =========================================================
   ARENA — painel de testes A/B/C/D
   ========================================================= */
const LETRAS = 'ABCDEFGH';
const CORES = {A:'#6FA8DC',B:'#E07A8B',C:'#7CC6A4',D:'#B39DDB',E:'#F0A35E',F:'#5EC4C9',G:'#C9D66B',H:'#A7AFBD'};
const METRICAS = {vendas:'Vendas na Hotmart', obrigado:'Visitas à página de obrigado', checkout:'Cliques no checkout'};
const METRICA_CURTA = {vendas:'vendas por visitante', obrigado:'chegaram ao obrigado', checkout:'clicaram no checkout'};
const PERIODOS = [['1','24 horas'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']];
const MIN_VIS = 100, MIN_CONV = 10, CONF = 0.95;

const S = {
  api: localStorage.getItem('arena_api') || '',
  key: localStorage.getItem('arena_key') || '',
  testes: [], atual: null, aba: 'resultados',
  periodo: 'tudo', metrica: null, dados: null, carregando: false,
  serieModo: 'visitantes', segModo: 'campanha', rascunho: null, atualizadoEm: 0
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (n||0).toLocaleString('pt-BR');
const fmtPct = (x, casas=1) => isFinite(x) ? (x*100).toLocaleString('pt-BR',{minimumFractionDigits:casas,maximumFractionDigits:casas}) + '%' : '–';
const fmtBRL = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtTempo = s => { s = Math.round(s||0); if (!s) return '–'; const m = Math.floor(s/60); return m ? `${m}m ${String(s%60).padStart(2,'0')}s` : `${s}s`; };
const curto = u => { try { const x = new URL(u); return x.host.replace(/^www\./,'') + (x.pathname === '/' ? '' : x.pathname); } catch { return u; } };
const testeAtual = () => S.testes.find(t => t.id === S.atual) || null;

/* ---------- API ---------- */
async function apiGet(params){
  const u = new URL(S.api);
  Object.entries({...params, key:S.key}).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro ao falar com a planilha.');
  return j;
}
async function apiPost(body){
  const r = await fetch(S.api, {method:'POST', body: JSON.stringify({...body, key:S.key})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || 'Erro ao salvar.');
  return j;
}

let toastTimer;
function toast(msg, tipo){
  const el = $('#toast');
  el.textContent = msg; el.className = 'toast' + (tipo ? ' ' + tipo : ''); el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 5000);
}

/* ---------- Estatística bayesiana ---------- */
function normal(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function gama(k){
  if (k < 1) return gama(k+1) * Math.pow(Math.random(), 1/k);
  const d = k - 1/3, c = 1/Math.sqrt(9*d);
  for(;;){
    let x, v;
    do { x = normal(); v = 1 + c*x; } while (v <= 0);
    v = v*v*v; const u = Math.random();
    if (u < 1 - 0.0331*x*x*x*x) return d*v;
    if (Math.log(u) < 0.5*x*x + d*(1 - v + Math.log(v))) return d*v;
  }
}
function beta(a,b){ const x = gama(a), y = gama(b); return x/(x+y); }
const cacheProb = new Map();
function probMelhor(lista){
  const chave = JSON.stringify(lista);
  if (cacheProb.has(chave)) return cacheProb.get(chave);
  const N = 12000, vit = lista.map(() => 0);
  for (let i=0;i<N;i++){
    let melhor = -1, idx = 0;
    for (let j=0;j<lista.length;j++){
      const s = beta(1 + lista[j].c, 1 + Math.max(0, lista[j].n - lista[j].c));
      if (s > melhor){ melhor = s; idx = j; }
    }
    vit[idx]++;
  }
  const r = vit.map(v => v/N);
  cacheProb.set(chave, r);
  return r;
}

/* ---------- Cálculo dos resultados ---------- */
function calcular(){
  const t = testeAtual(), d = S.dados;
  const m = S.metrica || t.metrica || 'vendas';
  const somaPeso = d.variantes.reduce((a,v) => a + (Number(v.peso)||0), 0) || 1;
  const totalVis = d.variantes.reduce((a,v) => a + v.visitantes, 0);
  const vs = d.variantes.map(v => {
    const conv = m === 'vendas' ? v.vendas : m === 'obrigado' ? v.obrigados : v.cliques;
    const n = Math.max(v.visitantes, conv);
    return {...v, conv, n, taxa: n ? conv/n : 0,
      parte: totalVis ? v.visitantes/totalVis : 0, meta: (Number(v.peso)||0)/somaPeso,
      rpv: v.visitantes ? (v.receita - v.valorReembolsos)/v.visitantes : 0, prob: 0};
  });
  const comDados = vs.filter(v => v.n > 0);
  if (comDados.length >= 2){
    const p = probMelhor(comDados.map(v => ({c:v.conv, n:v.n})));
    comDados.forEach((v,i) => v.prob = p[i]);
  } else if (comDados.length === 1) comDados[0].prob = 1;
  const controle = vs[0];
  vs.forEach((v,i) => v.lift = i === 0 || !controle.taxa ? null : (v.taxa - controle.taxa)/controle.taxa);

  const totalConv = vs.reduce((a,v) => a + v.conv, 0);
  const lider = comDados.length ? comDados.reduce((a,b) => b.prob > a.prob ? b : a) : null;
  const minVis = comDados.length ? Math.min(...vs.filter(v => v.peso > 0 || v.n > 0).map(v => v.visitantes)) : 0;
  let estado;
  if (!totalVis) estado = 'vazio';
  else if (minVis < MIN_VIS || totalConv < MIN_CONV) estado = 'coletando';
  else if (lider.prob >= CONF) estado = 'vencedora';
  else if (lider.prob >= 0.8) estado = 'tendencia';
  else estado = 'empate';

  return {m, vs, lider, estado, totalVis, totalConv, minVis,
    acessos: vs.reduce((a,v)=>a+v.acessos,0),
    receita: vs.reduce((a,v)=>a+v.receita,0),
    reemb: vs.reduce((a,v)=>a+v.reembolsos,0),
    vendas: vs.reduce((a,v)=>a+v.vendas,0),
    obrigados: vs.reduce((a,v)=>a+v.obrigados,0)};
}

/* ---------- Render geral ---------- */
function render(){
  if (!S.api || !S.key) return telaConexao();
  $('#raiz').innerHTML = `<div class="app"><aside class="lateral" id="lateral"></aside><main id="principal"></main></div>`;
  renderLateral(); renderMain();
}

function renderLateral(){
  const ordem = {ativo:0, pausado:1, encerrado:2};
  const lista = [...S.testes].sort((a,b) => (ordem[a.status]??3) - (ordem[b.status]??3) || String(b.criadoEm).localeCompare(String(a.criadoEm)));
  $('#lateral').innerHTML = `
    <p class="marca">Arena<small>Testes de página</small></p>
    <button class="btn principal" data-acao="novo">Novo teste</button>
    <nav aria-label="Testes">
      <ul class="lista-testes">
        ${lista.map(t => `<li><button data-teste="${esc(t.id)}" aria-current="${t.id===S.atual}">
          <span class="ponto ${esc(t.status)}"></span><span class="nome">${esc(t.nome)}</span>
          <span class="sub">${t.variantes.length} páginas · ${t.status}</span></button></li>`).join('')}
      </ul>
    </nav>
    <div class="rodape"><button data-acao="desconectar">Trocar conexão</button></div>`;
}

function renderMain(){
  const el = $('#principal'); if (!el) return;
  const t = testeAtual();
  if (!t && S.aba !== 'variantes'){
    el.innerHTML = `<div class="vazio"><h2>Nenhum teste ainda</h2>
      <p>Cadastre as páginas que vão disputar o tráfego. O painel gera o código para colar no Elementor.</p>
      <button class="btn principal" data-acao="novo">Criar o primeiro teste</button></div>`;
    return;
  }
  const titulo = t ? t.nome : 'Novo teste';
  const meta = t ? `${t.variantes.length} páginas · ${METRICAS[t.metrica] || ''} · criado em ${new Date(t.criadoEm).toLocaleDateString('pt-BR')}` : 'Cadastre de 2 a 8 páginas';
  el.innerHTML = `
    <div class="topo"><div><h1>${esc(titulo)}</h1><div class="meta">${esc(meta)}</div></div>
      ${t && S.aba==='resultados' ? controlesResultados() : ''}</div>
    ${t ? `<div class="abas" role="tablist">
      ${[['resultados','Resultados'],['variantes','Páginas e pesos'],['instalacao','Instalação']].map(([k,r]) =>
        `<button role="tab" aria-selected="${S.aba===k}" data-aba="${k}">${r}</button>`).join('')}</div>` : ''}
    <div id="conteudo"></div>`;
  if (S.aba === 'resultados') renderResultados();
  else if (S.aba === 'variantes') renderEditor();
  else renderInstalacao();
}

function controlesResultados(){
  const t = testeAtual(); const m = S.metrica || t.metrica;
  return `<div class="controles">
    <div class="segmentos" role="group" aria-label="Período">${PERIODOS.map(([k,r]) =>
      `<button data-periodo="${k}" aria-pressed="${S.periodo===k}">${r}</button>`).join('')}</div>
    <label class="escondido" for="sel-metrica">Métrica de conversão</label>
    <select id="sel-metrica" class="campo">${Object.entries(METRICAS).map(([k,r]) =>
      `<option value="${k}" ${k===m?'selected':''}>${r}</option>`).join('')}</select>
    <button class="btn discreto" data-acao="atualizar" ${S.carregando?'disabled':''}>${S.carregando?'Atualizando…':'Atualizar'}</button>
  </div>`;
}

/* ---------- Resultados ---------- */
let grafico;
function renderResultados(){
  const c = $('#conteudo');
  if (!S.dados || S.dados.teste.id !== S.atual){ c.innerHTML = `<p class="carregando">Carregando dados da planilha…</p>`; return; }
  const R = calcular();
  c.innerHTML = placar(R) + totais(R) + competidores(R) + blocoGrafico() + blocoSegmentos(R) +
    `<p class="nota" style="color:var(--apagado);font-size:12.5px">Dados de ${new Date(S.dados.geradoEm).toLocaleString('pt-BR')}. Atualiza sozinho a cada minuto.</p>`;
  requestAnimationFrame(() => {
    document.querySelectorAll('.faixa').forEach(f => f.style.flexBasis = f.dataset.largura);
  });
  desenharGrafico(R);
}

function placar(R){
  const nomeDe = v => `${v.id} · ${v.nome}`;
  let frase, sub = '', acao = '';
  const L = R.lider;
  if (R.estado === 'vazio'){
    frase = 'Nenhum visitante ainda.';
    sub = 'Assim que o anúncio rodar, o placar aparece aqui. Se já está rodando, confira a aba Instalação.';
  } else if (R.estado === 'coletando'){
    frase = `${nomeDe(L)} está na frente, mas ainda é cedo.`;
    sub = `Com poucos dados, a diferença pode ser sorte. O resultado fica confiável quando cada página tem ${MIN_VIS} visitantes e o teste soma ${MIN_CONV} conversões.`;
  } else if (R.estado === 'vencedora'){
    frase = `${nomeDe(L)} venceu, com ${fmtPct(L.prob,0)} de chance de ser a melhor.`;
    sub = L.lift != null ? `Converte ${fmtPct(Math.abs(L.lift),0)} ${L.lift>=0?'a mais':'a menos'} que a página A.` : 'É a página de controle, e as outras não superaram ela.';
    acao = `<div class="acoes"><button class="btn principal" data-consagrar="${L.id}">Enviar 100% do tráfego para ${esc(L.id)}</button></div>`;
  } else if (R.estado === 'tendencia'){
    frase = `${nomeDe(L)} deve vencer: ${fmtPct(L.prob,0)} de chance de ser a melhor.`;
    sub = `O teste é dado como encerrado quando uma página chega a ${fmtPct(CONF,0)}. Deixe rodar mais um pouco.`;
  } else {
    frase = 'Nenhuma página se destacou até agora.';
    sub = 'As taxas estão próximas. Deixe rodar mais ou teste páginas mais diferentes entre si.';
  }
  const faixas = R.vs.map(v => `<span class="faixa ${L && v.id===L.id && R.estado!=='vazio' ? 'lider':''}" style="--c:${CORES[v.id]}"
      data-largura="${R.estado==='vazio' ? (100/R.vs.length) : Math.max(v.prob*100, v.prob>0?4:0)}%">${v.prob>=0.08 || R.estado==='vazio' ? v.id : ''}</span>`).join('');
  const legenda = R.vs.map(v => `<span><i class="chip" style="--c:${CORES[v.id]}">${v.id}</i>${esc(v.nome)} <b>${R.estado==='vazio'?'–':fmtPct(v.prob,0)}</b></span>`).join('');
  const progresso = R.estado === 'coletando' ? `<div class="progresso">
      <span>Menor página: <b>${fmtN(R.minVis)} de ${MIN_VIS}</b> visitantes</span>
      <span>Conversões: <b>${fmtN(R.totalConv)} de ${MIN_CONV}</b></span></div>` : '';
  const alertaVendas = R.m === 'vendas' && R.vendas === 0 && R.obrigados > 0
    ? `<p class="aviso">Chegaram ${fmtN(R.obrigados)} pessoas ao obrigado, mas nenhuma venda veio da Hotmart. Confira o webhook (passo 4 da Instalação) ou troque a métrica para “Visitas à página de obrigado”.</p>` : '';
  return `<section class="placar" aria-label="Placar">
    <p class="veredito">${esc(frase)}</p><p class="veredito-sub">${esc(sub)}</p>
    <div class="corrida" role="img" aria-label="Chance de cada página ser a melhor">${faixas}</div>
    <div class="legenda">${legenda}</div>${progresso}${acao}${alertaVendas}</section>`;
}

function totais(R){
  return `<div class="totais">
    <span><b>${fmtN(R.totalVis)}</b>visitantes</span>
    <span><b>${fmtN(R.acessos)}</b>acessos no link</span>
    <span><b>${fmtN(R.totalConv)}</b>${esc(METRICA_CURTA[R.m])}</span>
    <span><b>${fmtN(R.vendas)}</b>vendas</span>
    <span><b>${fmtBRL(R.receita)}</b>faturado</span>
    ${R.reemb ? `<span><b>${fmtN(R.reemb)}</b>reembolsos</span>` : ''}
  </div>`;
}

function competidores(R){
  return `<div class="competidores">${R.vs.map(v => {
    const lider = R.lider && v.id === R.lider.id && R.estado !== 'vazio' && R.vs.length > 1;

    const barra = x => `<i style="width:${Math.min(100, x/base*100)}%"></i>`;
    const pctDe = x => v.visitantes ? `<small>${fmtPct(x/v.visitantes)}</small>` : '';
    let lift = 'Página de controle';
    if (v.lift != null) lift = `<span class="${v.lift>=0?'sobe':'desce'}">${v.lift>=0?'+':'−'}${fmtPct(Math.abs(v.lift),0)}</span> em relação à A`;
    else if (R.vs[0].id !== v.id) lift = 'Sem base para comparar com a A';
    return `<article class="competidor ${lider?'lider':''}" style="--c:${CORES[v.id]}">
      <header><span class="letra">${v.id}</span><div><h3>${esc(v.nome)}</h3>
        <a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(curto(v.url))}</a></div>
        ${lider ? `<span class="coroa">${R.estado==='vencedora'?'Vencedora':'Na frente'}</span>` : ''}</header>
      <div class="taxa"><strong>${fmtPct(v.taxa, 2)}</strong><span>${esc(METRICA_CURTA[R.m])}</span></div>
      <p class="lift">${lift}</p>
      <dl class="funil">
        <div><dt>Visitantes</dt><dd>${fmtN(v.visitantes)}</dd>${barra(v.visitantes)}</div>
        <div><dt>Página carregou</dt><dd>${fmtN(v.chegadas)}${pctDe(v.chegadas)}</dd>${barra(v.chegadas)}</div>
        <div><dt>Clicaram no checkout</dt><dd>${fmtN(v.cliques)}${pctDe(v.cliques)}</dd>${barra(v.cliques)}</div>
        <div><dt>Chegaram ao obrigado</dt><dd>${fmtN(v.obrigados)}${pctDe(v.obrigados)}</dd>${barra(v.obrigados)}</div>
        <div><dt>Vendas aprovadas</dt><dd>${fmtN(v.vendas)}${pctDe(v.vendas)}</dd>${barra(v.vendas)}</div>
      </dl>
      <ul class="extras">
        <li><span>Tráfego recebido</span><b>${fmtPct(v.parte,0)}</b> <small style="color:var(--apagado)">meta ${fmtPct(v.meta,0)}</small></li>
        <li><span>Faturamento</span><b>${fmtBRL(v.receita)}</b></li>
        <li><span>Tempo médio</span><b>${fmtTempo(v.tempoMedio)}</b></li>
        <li><span>Rolagem média</span><b>${v.rolagemMedia ? v.rolagemMedia + '%' : '–'}</b></li>
        <li><span>Receita por visitante</span><b>${fmtBRL(v.rpv)}</b></li>
        <li><span>Reembolsos</span><b>${fmtN(v.reembolsos)}</b></li>
      </ul>
    </article>`; }).join('')}</div>`;
}

function blocoGrafico(){
  const modos = [['visitantes','Visitantes'],['conversoes','Conversões'],['taxa','Taxa acumulada']];
  return `<section class="bloco"><div class="bloco-topo"><div><h2>Dia a dia</h2>
      <p class="nota">A taxa acumulada mostra se a diferença entre as páginas está se firmando ou oscilando.</p></div>
    <div class="segmentos" role="group" aria-label="O que mostrar no gráfico">${modos.map(([k,r]) =>
      `<button data-serie="${k}" aria-pressed="${S.serieModo===k}">${r}</button>`).join('')}</div></div>
    <div class="grafico"><canvas id="canvas-grafico" aria-label="Gráfico diário por página"></canvas></div></section>`;
}

function desenharGrafico(R){
  const cv = $('#canvas-grafico'); if (!cv || !window.Chart) return;
  if (grafico) grafico.destroy();
  const serie = S.dados.serie;
  const campo = R.m === 'vendas' ? 'vendas' : R.m === 'obrigado' ? 'obr' : 'cli';
  const datasets = R.vs.map(v => {
    let acV = 0, acC = 0;
    const dados = serie.map(d => {
      const x = d.por[v.id] || {vis:0,cli:0,obr:0,vendas:0};
      acV += x.vis; acC += x[campo];
      if (S.serieModo === 'visitantes') return x.vis;
      if (S.serieModo === 'conversoes') return x[campo];
      return acV ? +(acC/acV*100).toFixed(2) : null;
    });
    return {label:`${v.id} · ${v.nome}`, data:dados, borderColor:CORES[v.id], backgroundColor:CORES[v.id],
      tension:.3, pointRadius: serie.length > 40 ? 0 : 3, borderWidth:2, spanGaps:true};
  });
  const cor = getComputedStyle(document.documentElement);
  Chart.defaults.color = cor.getPropertyValue('--suave').trim();
  Chart.defaults.font.family = cor.getPropertyValue('--sans').trim();
  grafico = new Chart(cv, {
    type:'line',
    data:{labels: serie.map(d => d.dia.split('-').reverse().slice(0,2).join('/')), datasets},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10,usePointStyle:true}},
        tooltip:{callbacks:{label: ctx => `${ctx.dataset.label}: ${S.serieModo==='taxa' ? (ctx.parsed.y ?? 0).toLocaleString('pt-BR') + '%' : fmtN(ctx.parsed.y)}`}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.04)'}}, y:{beginAtZero:true, grid:{color:'rgba(255,255,255,.06)'},
        ticks:{callback: v => S.serieModo==='taxa' ? v + '%' : v}}},
      animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? false : {duration:500}}
  });
}

function blocoSegmentos(R){
  const dims = [['campanha','Campanha'],['anuncio','Anúncio'],['origem','Origem'],['dispositivo','Dispositivo']];
  const linhas = (S.dados.segmentos[S.segModo] || []);
  const campo = R.m === 'checkout' ? 'cli' : 'obr';
  const rot = R.m === 'checkout' ? 'clicaram no checkout' : 'chegaram ao obrigado';
  const tabela = linhas.length ? `<table><thead><tr><th>${dims.find(d=>d[0]===S.segModo)[1]}</th><th>Total</th>
      ${R.vs.map(v => `<th><span class="chip" style="--c:${CORES[v.id]}">${v.id}</span></th>`).join('')}</tr></thead>
    <tbody>${linhas.map(l => `<tr><td>${esc(l.chave)}</td><td>${fmtN(l.total)}</td>
      ${R.vs.map(v => { const x = l.por[v.id]; return x ? `<td>${fmtN(x.v)}<small>${fmtPct(x[campo]/x.v)}</small></td>` : '<td>–</td>'; }).join('')}
    </tr>`).join('')}</tbody></table>` : `<div class="vazio-tabela">Sem visitantes neste período.</div>`;
  return `<section class="bloco"><div class="bloco-topo"><div><h2>De onde vem cada resultado</h2>
      <p class="nota">Visitantes por página e a porcentagem que ${rot}. Vendas da Hotmart não entram aqui porque o webhook não informa o anúncio.</p></div>
    <div class="segmentos" role="group" aria-label="Agrupar por">${dims.map(([k,r]) =>
      `<button data-seg="${k}" aria-pressed="${S.segModo===k}">${r}</button>`).join('')}</div></div>
    <div class="tabela-rolagem">${tabela}</div></section>`;
}

    variantes:[{id:'A',nome:'Página A',url:'',peso:50},{id:'B',nome:'Página B',url:'',peso:50}]};

  $('#conteudo').innerHTML = `<div class="form">
    <div class="linha-form">
      <div><label class="rotulo" for="f-nome">Nome do teste</label>
        <input id="f-nome" class="campo" data-campo="nome" value="${esc(r.nome)}" placeholder="Ex.: Workshop MDL · headline"></div>
      <div><label class="rotulo" for="f-metrica">O que conta como conversão</label>
        <select id="f-metrica" class="campo" data-campo="metrica">${Object.entries(METRICAS).map(([k,t]) =>
          `<option value="${k}" ${r.metrica===k?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label class="rotulo" for="f-status">Situação</label>

          `<option value="${s}" ${r.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
    </div>

        <span class="chip">${esc(L)}</span>

        <input class="campo url" aria-label="Link da página ${esc(L)}" data-var="${i}" data-campo="url" value="${esc(v.url)}" placeholder="https://seusite.com.br/pagina-${L.toLowerCase()}" inputmode="url">
        <div class="peso"><input class="campo" type="number" min="0" step="1" aria-label="Peso da página ${esc(L)}" data-var="${i}" data-campo="peso" value="${esc(v.peso)}">
          <output data-parte="${i}">${fmtPct((Number(v.peso)||0)/soma,0)}</output></div>
        <button class="remover" data-remover="${i}" aria-label="Remover página ${esc(L)}" ${r.variantes.length<=2?'disabled':''}>×</button>
      </div>`; }).join('')}</div>
    <div class="acoes-form">

      <button class="btn discreto" data-acao="igualar">Dividir igualmente</button>
    </div>
    <div class="acoes-form"><button class="btn principal" data-acao="salvar">${r.id ? 'Salvar alterações' : 'Criar teste'}</button>
      ${r.id ? '' : '<button class="btn discreto" data-acao="cancelar">Cancelar</button>'}</div>
    ${r.id ? `<p class="aviso">Mudou links ou pesos? Depois de salvar, copie de novo o código da página de entrada (aba Instalação) e cole no Elementor. Remover uma página e adicionar outra depois gera uma letra nova, para não misturar os dados.</p>` : ''}
  </div>`;
}
function atualizarPartes(){
  const r = S.rascunho; const soma = r.variantes.reduce((a,v) => a + (Number(v.peso)||0), 0) || 1;
  r.variantes.forEach((v,i) => { const o = document.querySelector(`[data-parte="${i}"]`); if (o) o.textContent = fmtPct((Number(v.peso)||0)/soma,0); });
}
function proximaLetra(){ const usadas = new Set(S.rascunho.variantes.map(v => v.id)); return [...LETRAS].find(l => !usadas.has(l)); }

async function salvar(){
  const r = S.rascunho;
  if (!r.nome.trim()) return toast('Dê um nome ao teste.', 'erro');
  const semLink = r.variantes.find(v => !/^https?:\/\/\S+$/i.test(v.url.trim()));
  if (semLink) return toast(`Coloque um link completo na página ${semLink.id} (começando com https://).`, 'erro');
  const botao = document.querySelector('[data-acao="salvar"]'); if (botao){ botao.disabled = true; botao.textContent = 'Salvando…'; }
  try {
    const j = await apiPost({acao:'salvarTeste', teste:r});
    const novo = !r.id;
    const i = S.testes.findIndex(t => t.id === j.teste.id);
    if (i >= 0) S.testes[i] = j.teste; else S.testes.push(j.teste);
    S.atual = j.teste.id; location.hash = j.teste.id;
    S.rascunho = JSON.parse(JSON.stringify(j.teste));
    S.aba = 'instalacao'; S.dados = null;
    toast(novo ? 'Teste criado. Agora instale os códigos no Elementor.' : 'Alterações salvas. Cole o novo código da página de entrada no Elementor.');
    render(); carregarStats(true);
  } catch(e){
    toast(e.message, 'erro');
    if (botao){ botao.disabled = false; botao.textContent = r.id ? 'Salvar alterações' : 'Criar teste'; }
  }
}

async function consagrar(L){
  const t = testeAtual();
  if (!confirm(`Enviar 100% do tráfego para a página ${L}? As outras param de receber visitantes depois que você colar o novo código no Elementor.`)) return;
  S.rascunho = {...JSON.parse(JSON.stringify(t)), status:'encerrado'};
  S.rascunho.variantes.forEach(v => v.peso = v.id === L ? 100 : 0);
  await salvar();
}

/* ---------- Instalação (códigos gerados) ---------- */
function blocoCodigo(id, codigo){
  return `<div class="codigo"><pre id="${id}"><code>${esc(codigo)}</code></pre>
    <button class="btn" data-copiar="${id}">Copiar</button></div>`;
}

const JS_COMUM = api => `var API = ${JSON.stringify(api)};
  function ler(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function gravar(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function dispositivo(){ var ua = navigator.userAgent;
    if (/iPad|Tablet/i.test(ua)) return "tablet";
    if (/Mobi|iPhone/i.test(ua)) return "celular";
    if (/Android/i.test(ua)) return "tablet";
    return "computador"; }
  function mandar(dados){ var s = JSON.stringify(dados);
    try { if (navigator.sendBeacon && navigator.sendBeacon(API, new Blob([s], {type: "text/plain;charset=UTF-8"}))) return; } catch(e){}
    try { fetch(API, {method: "POST", body: s, keepalive: true, mode: "no-cors"}); } catch(e){} }`;

function codigoEntrada(t){
  const cfg = JSON.stringify(t.variantes.map(v => ({id:v.id, url:v.url, peso:Number(v.peso)||0}))).replace(/</g,'\\u003c');
  return `<!-- Arena · página de entrada · teste "${t.nome.replace(/--/g,'-')}" (${t.id}) · gerado em ${new Date().toLocaleString('pt-BR')} -->
<style>html,body{background:#fff!important}</style>
<script>
(function(){
  ${JS_COMUM(S.api)}
  var TESTE = "${t.id}";
  var PAGINAS = ${cfg};

  var vid = ler("ab_vid");
  if (!vid) { vid = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); gravar("ab_vid", vid); }

  var ativas = PAGINAS.filter(function(p){ return p.peso > 0; });
  if (!ativas.length) ativas = PAGINAS;
  var guardada = ler("ab_var_" + TESTE), escolhida = null;
  for (var i = 0; i < ativas.length; i++) if (ativas[i].id === guardada) escolhida = ativas[i];
  if (!escolhida) {
    var total = 0; ativas.forEach(function(p){ total += p.peso || 1; });
    var sorteio = Math.random() * total;
    for (var j = 0; j < ativas.length; j++) { sorteio -= (ativas[j].peso || 1); if (sorteio < 0) { escolhida = ativas[j]; break; } }
    escolhida = escolhida || ativas[ativas.length - 1];
    gravar("ab_var_" + TESTE, escolhida.id);
  }

  var q = new URLSearchParams(location.search), destino;
  try { destino = new URL(escolhida.url); } catch(e) { return; }
  q.forEach(function(valor, chave){ if (!destino.searchParams.has(chave)) destino.searchParams.set(chave, valor); });
  destino.searchParams.set("abt", TESTE);
  destino.searchParams.set("abv", escolhida.id);
  destino.searchParams.set("abid", vid);

  mandar({acao: "evento", tipo: "redirect", teste: TESTE, variante: escolhida.id, visitante: vid,
    utm_source: q.get("utm_source") || "", utm_medium: q.get("utm_medium") || "", utm_campaign: q.get("utm_campaign") || "",
    utm_content: q.get("utm_content") || "", utm_term: q.get("utm_term") || "",
    dispositivo: dispositivo(), referrer: document.referrer, pagina: location.origin + location.pathname});

  location.replace(destino.toString());
})();
<\/script>`;
}

function codigoVariantes(){
  return `<!-- Arena · rastreamento das páginas do teste (o mesmo código em todas) -->
<script>
(function(){
  ${JS_COMUM(S.api)}
  var q = new URLSearchParams(location.search), ctx = null, entrada = false;
  if (q.get("abt") && q.get("abv")) {
    ctx = {t: q.get("abt"), v: q.get("abv"), id: q.get("abid") || ler("ab_vid") || ("v" + Date.now().toString(36)),
      p: location.pathname, ts: Date.now(),
      u: {s: q.get("utm_source") || "", m: q.get("utm_medium") || "", c: q.get("utm_campaign") || "", n: q.get("utm_content") || "", r: q.get("utm_term") || ""}};
    gravar("ab_ctx", JSON.stringify(ctx)); gravar("ab_vid", ctx.id); entrada = true;
  } else {
    try { ctx = JSON.parse(ler("ab_ctx")); } catch(e) {}
    if (ctx && Date.now() - ctx.ts > 30 * 864e5) ctx = null;
  }
  if (!ctx) return;

  function enviar(tipo, extra){
    var d = {acao: "evento", tipo: tipo, teste: ctx.t, variante: ctx.v, visitante: ctx.id,
      utm_source: ctx.u.s, utm_medium: ctx.u.m, utm_campaign: ctx.u.c, utm_content: ctx.u.n, utm_term: ctx.u.r,
      dispositivo: dispositivo(), referrer: document.referrer, pagina: location.origin + location.pathname};
    for (var k in extra) d[k] = extra[k];
    mandar(d);
  }
  if (entrada) enviar("landing");

  // Links da Hotmart recebem sck=AB_teste_variante para a venda voltar identificada
  var SCK = "AB_" + ctx.t + "_" + ctx.v;
  function marcar(a){
    if (!a || !a.href || !/hotmart\\.com/i.test(a.href)) return false;
    try { var u = new URL(a.href); if (u.searchParams.get("sck") !== SCK) { u.searchParams.set("sck", SCK); a.href = u.toString(); } } catch(e) {}
    return true;
  }
  function marcarTodos(){ var l = document.querySelectorAll('a[href*="hotmart"]'); for (var i = 0; i < l.length; i++) marcar(l[i]); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", marcarTodos); else marcarTodos();
  window.addEventListener("load", marcarTodos);
  document.addEventListener("click", function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest("a") : null;
    if (marcar(a)) enviar("checkout_click");
  }, true);

  // Tempo ativo e rolagem, só na página em que a pessoa entrou
  if (ctx.p !== location.pathname) return;
  var rolagem = 0, ativo = 0, desde = document.visibilityState === "visible" ? Date.now() : 0, ultimo = "";
  function medir(){
    var h = document.documentElement, alt = Math.max(h.scrollHeight, 1);
    var p = Math.min(100, Math.round((window.scrollY + window.innerHeight) / alt * 100));
    if (p > rolagem) rolagem = p;
  }
  window.addEventListener("scroll", medir, {passive: true});
  window.addEventListener("load", function(){ rolagem = 0; medir(); });
  function fechar(){
    if (desde) { ativo += Date.now() - desde; desde = 0; }
    var s = Math.round(ativo / 1000) + "|" + rolagem;
    if (s === ultimo) return; ultimo = s;
    enviar("engajamento", {tempo: Math.round(ativo / 1000), rolagem: rolagem});
  }
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden") fechar(); else desde = Date.now();
  });
  window.addEventListener("pagehide", fechar);
})();
<\/script>`;
}

/* ---------- Tela de conexão ---------- */
function telaConexao(erro){
  $('#raiz').innerHTML = `<div class="centro"><form class="cartao-conexao" id="form-conexao">
    <h1>Arena</h1><p>Conecte o painel à planilha. Os dados ficam salvos só neste navegador.</p>
    <label class="rotulo" for="c-api">Endereço do App da Web (termina em /exec)</label>
    <input id="c-api" class="campo" required value="${esc(S.api)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="rotulo" for="c-key">Senha do painel (ADMIN_KEY do Code.gs)</label>
    <input id="c-key" class="campo" type="password" required value="${esc(S.key)}">
    ${erro ? `<p class="erro-txt">${esc(erro)}</p>` : ''}
    <button class="btn principal" type="submit">Conectar</button></form></div>`;
  $('#form-conexao').addEventListener('submit', async ev => {
    ev.preventDefault();
    S.api = $('#c-api').value.trim(); S.key = $('#c-key').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec/.test(S.api)) return telaConexao('O endereço precisa ser o do App da Web, terminando em /exec.');
    const b = ev.submitter; if (b){ b.disabled = true; b.textContent = 'Conectando…'; }
    try { await carregarTestes(); localStorage.setItem('arena_api', S.api); localStorage.setItem('arena_key', S.key); iniciarDepoisDeConectar(); }
    catch(e){ telaConexao(e.message === 'Failed to fetch' ? 'Não foi possível acessar o endereço. Confira se a implantação está com acesso “Qualquer pessoa”.' : e.message); }
  });
}

/* ---------- Dados ---------- */
async function carregarTestes(){ const j = await apiGet({acao:'testes'}); S.testes = j.testes; }

async function carregarStats(silencioso){
  const t = testeAtual(); if (!t) return;
  const id = t.id;
  S.carregando = true;
  if (!silencioso && S.aba === 'resultados') renderMain();
  const desde = S.periodo === 'tudo' ? '' : String(Date.now() - Number(S.periodo)*864e5);
  try {
    const j = await apiGet({acao:'stats', teste:id, desde});
    if (S.atual !== id) return;
    S.dados = j; S.atualizadoEm = Date.now();
    const i = S.testes.findIndex(x => x.id === id); if (i >= 0) S.testes[i] = j.teste;
  } catch(e){ toast(e.message, 'erro'); }
  finally { S.carregando = false; }
  if (S.aba === 'resultados' && S.atual === id) renderMain();
}

function selecionar(id){
  S.atual = id; S.dados = null; S.metrica = null; S.aba = 'resultados';
  S.rascunho = JSON.parse(JSON.stringify(testeAtual()));
  location.hash = id;
  renderLateral(); renderMain(); carregarStats(true);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('button'); if (!el) return;
  const d = el.dataset;
  if (d.teste) return selecionar(d.teste);
  if (d.aba){
    S.aba = d.aba;
    if (d.aba === 'variantes') S.rascunho = JSON.parse(JSON.stringify(testeAtual()));
    renderMain(); if (d.aba === 'resultados' && !S.dados) carregarStats(true); return;
  }
  if (d.periodo){ S.periodo = d.periodo; return carregarStats(); }
  if (d.serie){ S.serieModo = d.serie; return renderMain(); }
  if (d.seg){ S.segModo = d.seg; return renderMain(); }
  if (d.consagrar) return consagrar(d.consagrar);
  if (d.remover){ S.rascunho.variantes.splice(Number(d.remover), 1); return renderEditor(); }
  if (d.copiar){
    const txt = document.getElementById(d.copiar).textContent;
    try { await navigator.clipboard.writeText(txt); el.textContent = 'Copiado'; }
    catch { const r = document.createRange(); r.selectNodeContents(document.getElementById(d.copiar)); getSelection().removeAllRanges(); getSelection().addRange(r); el.textContent = 'Selecionado, use Ctrl+C'; }
    return setTimeout(() => el.textContent = 'Copiar', 2000);
  }
  switch (d.acao){
    case 'novo': S.atual = null; S.dados = null; S.aba = 'variantes'; S.rascunho = novoRascunho(); history.replaceState(null,'',location.pathname); renderLateral(); return renderMain();
    case 'cancelar': S.atual = S.testes[0]?.id || null; S.aba = 'resultados'; if (S.atual){ return selecionar(S.atual); } return renderMain();
    case 'atualizar': return carregarStats();
    case 'adicionar': { const L = proximaLetra(); if (!L) return; S.rascunho.variantes.push({id:L, nome:'Página '+L, url:'', peso:50}); return renderEditor(); }
    case 'igualar': S.rascunho.variantes.forEach(v => v.peso = Math.round(100/S.rascunho.variantes.length)); return renderEditor();
    case 'salvar': return salvar();
    case 'desconectar': localStorage.removeItem('arena_key'); S.key = ''; return telaConexao();
  }
});

document.addEventListener('input', ev => {
  const el = ev.target; if (!S.rascunho || !el.dataset.campo) return;
  const campo = el.dataset.campo;
  if (el.dataset.var != null){
    const v = S.rascunho.variantes[Number(el.dataset.var)];
    v[campo] = campo === 'peso' ? Math.max(0, Number(el.value) || 0) : el.value;
    if (campo === 'peso') atualizarPartes();
  } else S.rascunho[campo] = el.value;
});

document.addEventListener('change', ev => {
  if (ev.target.id === 'sel-metrica'){ S.metrica = ev.target.value; renderMain(); }
});

setInterval(() => {
  if (document.visibilityState === 'visible' && S.aba === 'resultados' && S.atual && !S.carregando) carregarStats(true);
}, 60000);

/* ---------- Início ---------- */
function iniciarDepoisDeConectar(){
  const h = decodeURIComponent(location.hash.slice(1));
  S.atual = S.testes.find(t => t.id === h)?.id || S.testes.find(t => t.status === 'ativo')?.id || S.testes[0]?.id || null;
  S.rascunho = S.atual ? JSON.parse(JSON.stringify(testeAtual())) : novoRascunho();
  S.aba = S.atual ? 'resultados' : 'variantes';
  render();
  if (S.atual) carregarStats(true);
}
(async function iniciar(){
  if (!S.api || !S.key) return telaConexao();
  $('#raiz').innerHTML = `<div class="centro"><p class="carregando">Conectando à planilha…</p></div>`;
  try { await carregarTestes(); } catch(e){ return telaConexao(e.message); }
  iniciarDepoisDeConectar();
})();
</script>
